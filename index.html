<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shop Together</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0d0d;--paper:#f5f2ec;--cream:#ede9e1;--accent:#c8402a;--muted:#8a8580;--border:#ccc9c0;--green:#2a8c5a;--font:'Syne',sans-serif;--mono:'DM Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);}
body{display:flex;flex-direction:column;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;}
.header{border-bottom:2px solid var(--ink);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);position:sticky;top:0;z-index:50;}
.logo{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.logo span{color:var(--accent);}
.room-info{display:flex;align-items:center;gap:10px;}
.room-pill{font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--paper);padding:4px 10px;border-radius:2px;letter-spacing:0.05em;}
.users-count{font-size:12px;color:var(--muted);font-family:var(--mono);}
.screen{display:none;flex:1;}
.screen.active{display:flex;flex-direction:column;}
.join-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
.join-card{width:100%;max-width:400px;}
.join-title{font-size:42px;font-weight:800;letter-spacing:-2px;line-height:1;margin-bottom:6px;}
.join-sub{font-size:14px;color:var(--muted);margin-bottom:32px;font-family:var(--mono);}
.tabs{display:flex;border:2px solid var(--ink);margin-bottom:24px;border-radius:2px;overflow:hidden;}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;background:transparent;border:none;font-family:var(--font);transition:all 0.15s;}
.tab.active{background:var(--ink);color:var(--paper);}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;display:block;}
.form-input{width:100%;padding:11px 14px;border:2px solid var(--ink);background:var(--paper);font-family:var(--font);font-size:14px;border-radius:2px;outline:none;}
.form-input:focus{border-color:var(--accent);}
.btn-primary{width:100%;padding:13px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;border-radius:2px;transition:all 0.15s;}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);}
.error-msg{font-size:12px;color:var(--accent);font-family:var(--mono);margin-top:8px;display:none;}
.error-msg.show{display:block;}
.app-wrap{flex:1;display:flex;flex-direction:column;max-width:600px;margin:0 auto;width:100%;}
.add-area{padding:16px 20px;border-bottom:1.5px solid var(--border);background:var(--cream);}
.add-row{display:flex;gap:8px;}
.add-input{flex:1;padding:10px 14px;border:2px solid var(--ink);background:var(--paper);font-family:var(--font);font-size:14px;border-radius:2px;outline:none;}
.add-input:focus{border-color:var(--accent);}
.add-btn{padding:10px 20px;background:var(--accent);color:white;border:2px solid var(--accent);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;border-radius:2px;}
.add-btn:active{background:#a33220;}
.suggestions-label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:10px;margin-bottom:5px;}
.suggestions{display:flex;flex-wrap:wrap;gap:5px;}
.suggestion-chip{padding:4px 10px;background:var(--paper);border:1.5px solid var(--border);font-size:11px;font-family:var(--mono);cursor:pointer;border-radius:2px;color:var(--muted);}
.suggestion-chip:active{border-color:var(--ink);color:var(--ink);}
.list-area{flex:1;overflow-y:auto;padding:0 20px 20px;}
.list-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);text-align:center;}
.list-empty-icon{font-size:48px;margin-bottom:12px;opacity:0.3;}
.list-empty-text{font-size:14px;font-family:var(--mono);}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);padding:14px 0 6px;border-bottom:1px solid var(--border);margin-bottom:4px;font-family:var(--mono);}

/* ITEM */
.item{padding:12px 0;border-bottom:1px solid var(--border);}
.item-main{display:flex;align-items:center;gap:10px;}
.check-box{width:22px;height:22px;border:2px solid var(--ink);border-radius:2px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;transition:all 0.1s;}
.check-box.ticked{background:var(--green);border-color:var(--green);}
.check-box.ticked::after{content:'✓';color:white;font-size:13px;font-weight:700;}
.item-name-wrap{flex:1;min-width:0;}
.item-name{font-size:14px;font-weight:600;transition:all 0.1s;}
.item.done .item-name{text-decoration:line-through;color:var(--muted);}
.item-by{font-size:10px;font-family:var(--mono);color:var(--muted);margin-top:1px;}
.who-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}
.item-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.qty-badge{font-size:11px;font-family:var(--mono);background:var(--ink);color:var(--paper);padding:2px 7px;border-radius:2px;cursor:pointer;}
.qty-badge.empty{background:var(--border);color:var(--muted);}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 4px;}
.del-btn:active{color:var(--accent);}

/* EXPAND AREA */
.item-expand{display:none;margin-top:8px;margin-left:32px;}
.item-expand.open{display:block;}
.expand-row{display:flex;gap:8px;margin-bottom:6px;align-items:center;}
.expand-label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;min-width:36px;}
.expand-input{flex:1;padding:6px 10px;border:1.5px solid var(--border);background:var(--paper);font-family:var(--font);font-size:13px;border-radius:2px;outline:none;}
.expand-input:focus{border-color:var(--accent);}
.save-btn{padding:6px 12px;background:var(--ink);color:var(--paper);border:none;font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;border-radius:2px;}
.notes-display{font-size:12px;font-family:var(--mono);color:var(--muted);font-style:italic;margin-top:4px;margin-left:32px;}

.app-footer{padding:10px 20px;border-top:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--cream);}
.footer-stats{font-size:11px;font-family:var(--mono);color:var(--muted);}
.clear-btn{font-size:11px;font-family:var(--mono);background:none;border:1.5px solid var(--border);color:var(--muted);cursor:pointer;padding:4px 10px;border-radius:2px;}
.clear-btn:active{border-color:var(--accent);color:var(--accent);}
.connected-wrap{padding:8px 20px;background:var(--cream);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;overflow-x:auto;flex-shrink:0;}
.user-tag{font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:2px;white-space:nowrap;color:white;font-weight:500;}
.user-tag.you::after{content:' (you)';opacity:0.7;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:2px;font-size:12px;font-family:var(--mono);z-index:200;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.modal-bg{position:fixed;inset:0;background:rgba(13,13,13,0.6);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--paper);border:2px solid var(--ink);padding:24px;width:100%;max-width:360px;border-radius:2px;}
.modal h3{font-size:20px;font-weight:800;margin-bottom:6px;}
.modal p{font-size:12px;color:var(--muted);font-family:var(--mono);margin-bottom:16px;}
.share-code{font-size:28px;font-weight:800;letter-spacing:0.1em;font-family:var(--mono);text-align:center;padding:16px;background:var(--ink);color:var(--paper);border-radius:2px;margin-bottom:12px;cursor:pointer;}
.modal-close{width:100%;padding:10px;background:none;border:2px solid var(--ink);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;border-radius:2px;}
.modal-close:hover{background:var(--ink);color:var(--paper);}
.share-btn{background:none;border:1.5px solid var(--border);font-family:var(--mono);font-size:11px;padding:4px 10px;cursor:pointer;border-radius:2px;color:var(--muted);}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="modal-bg" id="share-modal">
  <div class="modal">
    <h3>Invite someone</h3>
    <p>Share this code — they enter it on the join screen</p>
    <div class="share-code" onclick="copyCode()" id="share-code-display">—</div>
    <p style="text-align:center;font-size:11px;font-family:var(--mono);color:var(--muted);margin-bottom:12px">tap to copy</p>
    <button class="modal-close" onclick="closeShareModal()">Done</button>
  </div>
</div>

<div class="header">
  <div class="logo">Shop<span>.</span></div>
  <div class="room-info" id="room-info" style="display:none">
    <span class="room-pill" id="room-pill">—</span>
    <span class="users-count" id="users-count"></span>
    <button class="share-btn" onclick="openShareModal()">+ invite</button>
  </div>
</div>

<div class="screen active" id="screen-join">
  <div class="join-wrap">
    <div class="join-card">
      <div class="join-title">Shop<br>Together.</div>
      <div class="join-sub">Real-time shared shopping lists</div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('create')">Create list</button>
        <button class="tab" onclick="switchTab('join')">Join list</button>
      </div>
      <div id="tab-create">
        <div class="form-group"><label class="form-label">Your name</label><input class="form-input" id="create-name" placeholder="e.g. Alex" maxlength="20"></div>
        <button class="btn-primary" onclick="createRoom()">Create new list</button>
      </div>
      <div id="tab-join" style="display:none">
        <div class="form-group"><label class="form-label">Your name</label><input class="form-input" id="join-name" placeholder="e.g. Sam" maxlength="20"></div>
        <div class="form-group">
          <label class="form-label">List code</label>
          <input class="form-input" id="join-code" placeholder="4-letter code" maxlength="4" style="text-transform:uppercase;font-family:var(--mono);letter-spacing:0.1em;font-size:18px;">
          <div class="error-msg" id="join-error">List not found. Check the code and try again.</div>
        </div>
        <button class="btn-primary" onclick="joinRoom()">Join list</button>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="screen-app">
  <div class="connected-wrap" id="connected-users"></div>
  <div class="app-wrap">
    <div class="add-area">
      <div class="add-row">
        <input class="add-input" id="add-input" placeholder="Add item..." maxlength="60">
        <button class="add-btn" id="add-btn">Add</button>
      </div>
      <div id="suggestions-wrap" style="display:none">
        <div class="suggestions-label">Recent</div>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>
    <div class="list-area" id="list-area"></div>
    <div class="app-footer">
      <div class="footer-stats" id="footer-stats">0 items</div>
      <button class="clear-btn" id="clear-btn">Clear checked</button>
    </div>
  </div>
</div>

<script>
const SB='https://edajjvqjgmqqvtbutaei.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkYWpqdnFqZ21xcXZ0YnV0YWVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODQ0NTAsImV4cCI6MjA5NjA2MDQ1MH0.8ekp6PDyaBpMKslTz_5vY-bUcyxxx4KQJvWbSRWw_CA';
const COLORS=['#c8402a','#2a6cc8','#2a8c5a','#8c2a8c','#c87a2a','#2a8c8c'];

// ── SUPABASE ──────────────────────────────────────────────
async function sbGet(t,p=''){
  const r=await fetch(`${SB}/rest/v1/${t}?${p}`,{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
  if(!r.ok)throw new Error(r.status);return r.json();
}
async function sbPost(t,d){
  const r=await fetch(`${SB}/rest/v1/${t}`,{method:'POST',headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(d)});
  if(!r.ok)throw new Error(await r.text());return r.json();
}
async function sbPatch(t,p,d){
  const r=await fetch(`${SB}/rest/v1/${t}?${p}`,{method:'PATCH',headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'},body:JSON.stringify(d)});
  if(!r.ok)throw new Error(r.status);
}
async function sbDelete(t,p){
  const r=await fetch(`${SB}/rest/v1/${t}?${p}`,{method:'DELETE',headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
  if(!r.ok)throw new Error(r.status);
}

// ── STATE ─────────────────────────────────────────────────
let roomCode='',myName='',myColor='',myId='';
let items=[],members=[],recentItems=[];
let expandedId=null;
let pollInterval=null;
let localCounter=0;

function uid(){return 'local_'+(++localCounter);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pickColor(n){return COLORS[n.charCodeAt(0)%COLORS.length];}
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ';return Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join('');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

// ── JOIN ──────────────────────────────────────────────────
function switchTab(t){
  document.getElementById('tab-create').style.display=t==='create'?'block':'none';
  document.getElementById('tab-join').style.display=t==='join'?'block':'none';
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(t==='create'&&i===0)||(t==='join'&&i===1)));
}
async function createRoom(){
  const name=document.getElementById('create-name').value.trim();
  if(!name){toast('Enter your name');return;}
  myName=name;myColor=pickColor(name);roomCode=genCode();
  try{
    await sbPost('shopping_rooms',[{code:roomCode,created_at:new Date().toISOString()}]);
    await enterRoom();
  }catch(e){toast('Error — try again');console.error(e);}
}
async function joinRoom(){
  const name=document.getElementById('join-name').value.trim();
  const code=document.getElementById('join-code').value.trim().toUpperCase();
  if(!name){toast('Enter your name');return;}
  if(code.length!==4){toast('Enter the 4-letter code');return;}
  try{
    const rooms=await sbGet('shopping_rooms',`code=eq.${code}`);
    if(!rooms||!rooms.length){document.getElementById('join-error').classList.add('show');return;}
    document.getElementById('join-error').classList.remove('show');
    myName=name;myColor=pickColor(name);roomCode=code;
    await enterRoom();
  }catch(e){toast('Connection error');console.error(e);}
}
async function enterRoom(){
  const mem=await sbPost('shopping_members',[{room_code:roomCode,name:myName,color:myColor,joined_at:new Date().toISOString()}]);
  myId=mem[0].id;
  try{
    const hist=await sbGet('shopping_history',`room_code=eq.${roomCode}&order=used_at.desc&limit=20`);
    recentItems=hist?[...new Set(hist.map(h=>h.item_name))]:[];
  }catch(e){}
  document.getElementById('screen-join').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');
  document.getElementById('room-info').style.display='flex';
  document.getElementById('room-pill').textContent=roomCode;
  document.getElementById('share-code-display').textContent=roomCode;
  renderSuggestions();
  await fetchAll();
  pollInterval=setInterval(fetchAll,2500);
  window.addEventListener('beforeunload',()=>sbDelete('shopping_members',`id=eq.${myId}`).catch(()=>{}));
}

// ── DATA ──────────────────────────────────────────────────
async function fetchAll(){
  try{
    const[its,mems]=await Promise.all([
      sbGet('shopping_items',`room_code=eq.${roomCode}&order=created_at.asc`),
      sbGet('shopping_members',`room_code=eq.${roomCode}&order=joined_at.asc`)
    ]);
    // Merge: keep local optimistic items, replace with server data
    const serverIds=new Set((its||[]).map(i=>String(i.id)));
    const localOnly=items.filter(i=>String(i.id).startsWith('local_'));
    items=[...(its||[]),...localOnly];
    members=mems||[];
    renderList();renderMembers();renderFooter();
  }catch(e){}
}

// ── ADD ITEM ──────────────────────────────────────────────
async function addItem(){
  const inp=document.getElementById('add-input');
  const name=inp.value.trim();
  if(!name)return;
  inp.value='';
  // Optimistic
  const tempId=uid();
  const temp={id:tempId,name,qty:'',notes:'',added_by:myName,added_color:myColor,checked:false,room_code:roomCode,_local:true};
  items=[...items,temp];
  renderList();renderFooter();
  try{
    const created=await sbPost('shopping_items',[{room_code:roomCode,name,qty:'',notes:'',added_by:myName,added_color:myColor,checked:false,created_at:new Date().toISOString()}]);
    // Replace temp with real
    const real=created[0];
    items=items.map(i=>i.id===tempId?{...real}:i);
    sbPost('shopping_history',[{room_code:roomCode,item_name:name,used_at:new Date().toISOString()}]).catch(()=>{});
    if(!recentItems.includes(name)){recentItems.unshift(name);if(recentItems.length>20)recentItems.pop();}
    renderList();renderFooter();renderSuggestions();
  }catch(e){
    items=items.filter(i=>i.id!==tempId);
    renderList();renderFooter();
    toast('Error adding item');
  }
}

function addSuggestion(name){
  document.getElementById('add-input').value=name;
  document.getElementById('add-input').focus();
}

// ── CHECK / DELETE ────────────────────────────────────────
function toggleCheck(id){
  const idx=items.findIndex(i=>String(i.id)===String(id));
  if(idx<0)return;
  const newVal=!items[idx].checked;
  items[idx]={...items[idx],checked:newVal};
  renderList();renderFooter();
  if(!String(id).startsWith('local_')){
    sbPatch('shopping_items',`id=eq.${id}`,{checked:newVal}).catch(()=>{
      items[idx]={...items[idx],checked:!newVal};renderList();renderFooter();
    });
  }
}

function deleteItem(id){
  const prev=[...items];
  items=items.filter(i=>String(i.id)!==String(id));
  if(expandedId===String(id))expandedId=null;
  renderList();renderFooter();
  if(!String(id).startsWith('local_')){
    sbDelete('shopping_items',`id=eq.${id}`).catch(()=>{items=prev;renderList();renderFooter();});
  }
}

function clearChecked(){
  const checked=items.filter(i=>i.checked);
  if(!checked.length){toast('No checked items');return;}
  items=items.filter(i=>!i.checked);
  renderList();renderFooter();
  checked.filter(i=>!String(i.id).startsWith('local_')).forEach(i=>sbDelete('shopping_items',`id=eq.${i.id}`).catch(()=>{}));
  toast(`Cleared ${checked.length} item${checked.length>1?'s':''}`);
}

// ── QTY / NOTES ───────────────────────────────────────────
function toggleExpand(id){
  expandedId=expandedId===String(id)?null:String(id);
  // Pause polling while editing so re-renders don't close the input
  if(expandedId){
    if(pollInterval){clearInterval(pollInterval);pollInterval=null;}
  }else{
    if(!pollInterval)pollInterval=setInterval(fetchAll,2500);
  }
  renderList();
}

function saveItemDetails(id){
  const qtyEl=document.getElementById(`qty-${id}`);
  const notesEl=document.getElementById(`notes-${id}`);
  if(!qtyEl||!notesEl)return;
  const qty=qtyEl.value.trim();
  const notes=notesEl.value.trim();
  const idx=items.findIndex(i=>String(i.id)===String(id));
  if(idx<0)return;
  items[idx]={...items[idx],qty,notes};
  expandedId=null;
  // Resume polling
  if(!pollInterval)pollInterval=setInterval(fetchAll,2500);
  renderList();renderFooter();
  if(!String(id).startsWith('local_')){
    sbPatch('shopping_items',`id=eq.${id}`,{qty,notes}).catch(()=>{});
  }
}

// ── RENDER ────────────────────────────────────────────────
function renderList(){
  const area=document.getElementById('list-area');
  if(!items.length){
    area.innerHTML=`<div class="list-empty"><div class="list-empty-icon">🛒</div><div class="list-empty-text">List is empty.<br>Add the first item above.</div></div>`;
    return;
  }
  const unchecked=items.filter(i=>!i.checked);
  const checked=items.filter(i=>i.checked);
  let html='';
  unchecked.forEach(i=>{html+=itemHTML(i);});
  if(checked.length){
    html+=`<div class="section-label">Checked (${checked.length})</div>`;
    checked.forEach(i=>{html+=itemHTML(i);});
  }
  area.innerHTML=html;
}

function itemHTML(item){
  const id=String(item.id);
  const color=item.added_color||'#666';
  const isMe=item.added_by===myName;
  const expanded=expandedId===id;
  const hasDetails=item.qty||item.notes;
  return`<div class="item${item.checked?' done':''}">
    <div class="item-main">
      <div class="check-box${item.checked?' ticked':''}" data-action="toggle" data-id="${id}"></div>
      <div class="item-name-wrap" data-action="expand" data-id="${id}" style="cursor:pointer">
        <div class="item-name">${esc(item.name)}</div>
        <div class="item-by"><span class="who-dot" style="background:${color}"></span>${isMe?'you':esc(item.added_by||'')}</div>
      </div>
      <div class="item-actions">
        ${item.qty?`<span class="qty-badge" data-action="expand" data-id="${id}">${esc(item.qty)}</span>`:`<span class="qty-badge empty" data-action="expand" data-id="${id}">+ qty</span>`}
        <button class="del-btn" data-action="delete" data-id="${id}">×</button>
      </div>
    </div>
    ${item.notes&&!expanded?`<div class="notes-display">📝 ${esc(item.notes)}</div>`:''}
    <div class="item-expand${expanded?' open':''}">
      <div class="expand-row">
        <span class="expand-label">Qty</span>
        <input class="expand-input" id="qty-${id}" value="${esc(item.qty||'')}" placeholder="e.g. 2x, 500g, 1 bag">
      </div>
      <div class="expand-row">
        <span class="expand-label">Notes</span>
        <input class="expand-input" id="notes-${id}" value="${esc(item.notes||'')}" placeholder="e.g. Woolies brand, wholemeal only">
      </div>
      <div class="expand-row">
        <button class="save-btn" data-action="save" data-id="${id}">Save</button>
      </div>
    </div>
  </div>`;
}

// ── EVENT DELEGATION ──────────────────────────────────────
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const action=el.dataset.action;
  const id=el.dataset.id;
  if(action==='toggle'){e.stopPropagation();toggleCheck(id);}
  else if(action==='delete'){e.stopPropagation();deleteItem(id);}
  else if(action==='expand'){e.stopPropagation();toggleExpand(id);}
  else if(action==='save'){e.stopPropagation();saveItemDetails(id);}
});

document.getElementById('add-btn').addEventListener('click',addItem);
document.getElementById('add-input').addEventListener('keydown',e=>{if(e.key==='Enter')addItem();});
document.getElementById('clear-btn').addEventListener('click',clearChecked);

// ── MEMBERS / SUGGESTIONS ─────────────────────────────────
function renderMembers(){
  document.getElementById('connected-users').innerHTML=members.map(m=>`<span class="user-tag${m.name===myName?' you':''}" style="background:${m.color}">${esc(m.name)}</span>`).join('');
  document.getElementById('users-count').textContent=`${members.length} online`;
}
function renderSuggestions(){
  const wrap=document.getElementById('suggestions-wrap');
  if(!recentItems.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  document.getElementById('suggestions').innerHTML=recentItems.slice(0,12).map(n=>`<div class="suggestion-chip" data-action="suggest" data-name="${esc(n)}">${esc(n)}</div>`).join('');
}
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action="suggest"]');
  if(!el)return;
  addSuggestion(el.dataset.name);
});
function renderFooter(){
  const total=items.length,done=items.filter(i=>i.checked).length;
  document.getElementById('footer-stats').textContent=total?`${done}/${total} checked`:'0 items';
}

// ── MODAL ─────────────────────────────────────────────────
function openShareModal(){document.getElementById('share-modal').classList.add('show');}
function closeShareModal(){document.getElementById('share-modal').classList.remove('show');}
function copyCode(){navigator.clipboard.writeText(roomCode).then(()=>toast('Code copied!')).catch(()=>toast(roomCode));}

// ── JOIN INPUTS ───────────────────────────────────────────
document.getElementById('join-code').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();});
document.getElementById('join-code').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});
document.getElementById('join-name').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});
document.getElementById('create-name').addEventListener('keydown',e=>{if(e.key==='Enter')createRoom();});
</script>
